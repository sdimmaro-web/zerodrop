<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZeroDrop — Апгрейд</title>
<link rel="stylesheet" href="/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.upgrade-page{max-width:1400px;margin:24px auto 90px;padding:0 20px}
.upgrade-title{text-align:center;font-size:34px;font-weight:800;letter-spacing:.5px;margin:18px 0 28px}
.upgrade-main{
  display:grid;grid-template-columns:1fr 280px 1fr;gap:22px;align-items:stretch;
}
.up-slot{
  background:linear-gradient(180deg,#161616,#101010);
  border:1px solid rgba(255,255,255,.06);border-radius:22px;padding:22px;min-height:320px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  position:relative;
}
.up-slot h3{color:#98a2b7;font-size:14px;font-weight:600;margin-bottom:16px}
.up-slot .placeholder{color:#5a6478;font-size:15px;line-height:1.45;max-width:220px}
.up-item-preview img{width:180px;height:140px;object-fit:contain;filter:drop-shadow(0 12px 28px rgba(0,0,0,.5))}
.up-item-preview .n{margin-top:12px;font-weight:700;font-size:16px}
.up-item-preview .p{margin-top:6px;color:#ffb400;font-weight:800;font-size:20px}
.up-clear{
  position:absolute;top:14px;right:14px;background:#222;border:none;color:#aaa;
  width:32px;height:32px;border-radius:10px;cursor:pointer;font-size:16px;
}
.up-clear:hover{background:#333;color:#fff}

.chance-panel{
  background:linear-gradient(180deg,#161616,#101010);
  border:1px solid rgba(255,255,255,.06);border-radius:22px;padding:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
.chance-wrap{
  position:relative;width:240px;height:240px;
  display:flex;align-items:center;justify-content:center;
}
.chance-dial{
  width:220px;height:220px;border-radius:50%;position:relative;
  background:#0c0c0c;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 40px rgba(255,180,0,.15), inset 0 0 0 2px rgba(255,255,255,.06);
}
.chance-wrap.is-spinning .chance-dial{
  box-shadow:0 0 55px rgba(250,204,21,.35), 0 0 30px rgba(249,115,22,.25);
}
/* SVG-кольцо: цветная дуга = победа, серая = проигрыш */
.chance-ring-svg{
  position:absolute;inset:0;width:100%;height:100%;
  transform:rotate(-90deg);
  z-index:1;pointer-events:none;
}
.chance-ring-svg .ring-bg{
  fill:none;stroke:#2a2a2a;stroke-width:14;
}
.chance-ring-svg .ring-win{
  fill:none;stroke-width:14;stroke-linecap:butt;
  transition:stroke-dasharray .2s ease;
}
.chance-dial-ticks{
  position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(from -90deg, transparent 0 7deg, rgba(255,255,255,.05) 7deg 8deg);
  pointer-events:none;z-index:2;
  -webkit-mask:radial-gradient(farthest-side, transparent 68%, #000 69%);
  mask:radial-gradient(farthest-side, transparent 68%, #000 69%);
}
/* стрелка крутится вокруг центра круга */
.chance-needle{
  position:absolute;inset:0;z-index:5;
  pointer-events:none;
  transform-origin:50% 50%;
  will-change:transform;
}
.chance-pointer{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:11px solid transparent;
  border-right:11px solid transparent;
  border-top:20px solid #ffd84d;
  filter:drop-shadow(0 0 10px rgba(255,200,0,.9));
  z-index:2;
}
.chance-pointer-dot{
  position:absolute;top:16px;left:50%;transform:translateX(-50%);
  width:10px;height:10px;border-radius:50%;
  background:#ffd84d;box-shadow:0 0 8px rgba(255,200,0,.8);
}
.chance-needle-line{
  position:absolute;top:20px;left:50%;margin-left:-1.5px;
  width:3px;height:72px;
  background:linear-gradient(180deg,#ffb400 0%,rgba(255,180,0,.2) 100%);
  border-radius:2px;
}
.chance-inner{position:relative;z-index:3;text-align:center}
.chance-value{font-size:28px;font-weight:900;color:#ffb400;transition:color .3s}
.chance-label{font-size:12px;color:#8d97ad;margin-top:4px;text-transform:uppercase;letter-spacing:.5px}
.chance-result{
  position:absolute;inset:28px;display:none;align-items:center;justify-content:center;
  border-radius:50%;z-index:4;font-size:20px;font-weight:900;text-align:center;padding:16px;
  line-height:1.25;white-space:pre-line;animation:resultPop .4s ease;
}
.chance-result.win{display:flex;background:rgba(12,60,30,.92);color:#6dff9a;box-shadow:0 0 30px rgba(34,197,94,.35)}
.chance-result.lose{display:flex;background:rgba(50,15,15,.92);color:#ff8a8a;box-shadow:0 0 30px rgba(255,80,80,.25)}
@keyframes resultPop{
  from{opacity:0;transform:scale(.7)}
  to{opacity:1;transform:scale(1)}
}

.up-controls{margin-top:22px;display:flex;flex-direction:column;align-items:center;gap:14px}
.balance-add-row{
  display:flex;align-items:center;gap:12px;background:#141414;border-radius:14px;
  padding:10px 16px;border:1px solid rgba(255,255,255,.05);width:min(420px,100%);
}
.balance-add-row label{color:#8d97ad;font-size:13px;white-space:nowrap}
.balance-add-row input[type=range]{flex:1}
.balance-add-val{color:#ffb400;font-weight:700;min-width:70px;text-align:right}

.chance-presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chance-presets button{
  height:36px;padding:0 14px;border-radius:10px;border:1px solid rgba(255,255,255,.08);
  background:#1a1a1a;color:#c4c4c4;font-weight:700;cursor:pointer;transition:.2s;
}
.chance-presets button:hover,.chance-presets button.active{
  border-color:#ffb400;color:#111;background:linear-gradient(90deg,#ff9900,#ffd84d);
}

.btn-upgrade{
  width:min(360px,100%);height:56px;border:none;border-radius:14px;cursor:pointer;
  background:linear-gradient(90deg,#ff8a00,#ffd500);color:#111;font-size:18px;font-weight:800;
  transition:.25s;
}
.btn-upgrade:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,180,0,.3)}
.btn-upgrade:disabled{opacity:.45;cursor:not-allowed}

.upgrade-bottom{
  margin-top:36px;display:grid;grid-template-columns:1fr 1fr;gap:24px;
}
.panel{
  background:linear-gradient(180deg,#161616,#101010);
  border:1px solid rgba(255,255,255,.06);border-radius:22px;padding:22px;
}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
.panel-head h2{font-size:20px;font-weight:800}
.panel-head input{
  height:40px;border:none;border-radius:10px;background:#141414;color:#fff;
  padding:0 14px;width:200px;outline:none;
}
.panel-head input:focus{box-shadow:0 0 0 2px rgba(255,180,0,.25)}

.items-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;
  max-height:380px;overflow-y:auto;padding-right:4px;
}
.skin-card{
  background:#141414;border:1px solid rgba(255,255,255,.05);border-radius:14px;
  padding:12px;text-align:center;cursor:pointer;transition:.25s;
}
.skin-card:hover{transform:translateY(-4px);border-color:rgba(255,180,0,.35)}
.skin-card.selected{border-color:#ffb400;box-shadow:0 0 0 1px #ffb400}
.skin-card img{width:100%;height:80px;object-fit:contain}
.skin-card .n{margin-top:8px;font-size:12px;font-weight:600;min-height:32px;line-height:1.25}
.skin-card .p{margin-top:4px;color:#ffb400;font-weight:800;font-size:13px}

.empty-hint{color:#8d97ad;text-align:center;padding:30px 10px;grid-column:1/-1}

@media(max-width:1100px){
  .upgrade-main{grid-template-columns:1fr;max-width:520px;margin:0 auto}
  .upgrade-bottom{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="bg"></div>
<header>
  <a href="/" class="logo" aria-label="ZeroDrop"><img src="/images/logo_zerodrop.png" alt="ZeroDrop"></a>
  <nav class="menu">
    <a href="/">Кейсы</a>
    <a href="/upgrade.html" class="active">Апгрейд</a>
    <a href="/contracts.html">Контракты</a>
    <a href="/profile.html">Профиль</a>
  </nav>
  <div class="user-panel">
    <div class="balance">
      <div class="balance-title">Баланс</div>
      <div class="balance-money" id="balance">0 ₽</div>
    </div>
    <a class="profile auth-profile-link" href="/auth/steam">Войти через Steam</a>
  </div>
</header>

<main class="upgrade-page">
  <h1 class="upgrade-title">МОДЕРНИЗАЦИЯ ОРУЖИЯ</h1>

  <div class="upgrade-main">
    <div class="up-slot" id="inputSlot">
      <button type="button" class="up-clear" id="clearInput" hidden title="Убрать">×</button>
      <h3>Выберите предмет на апгрейд</h3>
      <div class="placeholder" id="inputPlaceholder">Выберите скин из инвентаря ниже</div>
      <div class="up-item-preview" id="inputPreview" hidden>
        <img id="inputImg" alt="">
        <div class="n" id="inputName"></div>
        <div class="p" id="inputPrice"></div>
      </div>
    </div>

    <div class="chance-panel">
      <div class="chance-wrap" id="chanceWrap">
        <div class="chance-dial" id="chanceDial">
          <!-- SVG кольцо: цветная дуга = победа, серая = проигрыш -->
          <svg class="chance-ring-svg" viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <linearGradient id="winGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#16a34a"/>
                <stop offset="30%" stop-color="#facc15"/>
                <stop offset="65%" stop-color="#fb923c"/>
                <stop offset="100%" stop-color="#ef4444"/>
              </linearGradient>
            </defs>
            <!-- серый фон всего кольца (проигрыш) -->
            <circle class="ring-bg" cx="50" cy="50" r="42"/>
            <!-- цветная дуга победы, длина через stroke-dasharray -->
            <circle class="ring-win" id="ringWin" cx="50" cy="50" r="42"
              stroke="url(#winGrad)"
              stroke-dasharray="0 264"
              stroke-dashoffset="0"/>
          </svg>
          <div class="chance-dial-ticks"></div>
          <div class="chance-inner">
            <div class="chance-value" id="chanceValue">0%</div>
            <div class="chance-label" id="chanceLabel">шанс</div>
          </div>
          <div class="chance-result" id="chanceResult"></div>
        </div>
        <div class="chance-needle" id="chanceNeedle">
          <div class="chance-pointer"></div>
          <div class="chance-pointer-dot"></div>
          <div class="chance-needle-line"></div>
        </div>
      </div>
    </div>

    <div class="up-slot" id="targetSlot">
      <button type="button" class="up-clear" id="clearTarget" hidden title="Убрать">×</button>
      <h3>Оружие, которое хотите получить</h3>
      <div class="placeholder" id="targetPlaceholder">Выберите цель из каталога справа</div>
      <div class="up-item-preview" id="targetPreview" hidden>
        <img id="targetImg" alt="">
        <div class="n" id="targetName"></div>
        <div class="p" id="targetPrice"></div>
      </div>
    </div>
  </div>

  <div class="up-controls">
    <div class="balance-add-row">
      <label>Добавить баланс</label>
      <input type="range" id="balanceAdd" min="0" max="0" step="1" value="0">
      <span class="balance-add-val" id="balanceAddVal">0 ₽</span>
    </div>
    <div class="chance-presets">
      <button type="button" data-chance="25">25%</button>
      <button type="button" data-chance="50">50%</button>
      <button type="button" data-chance="75">75%</button>
      <button type="button" data-mult="2">×2</button>
      <button type="button" data-mult="5">×5</button>
    </div>
    <button type="button" class="btn-upgrade" id="upgradeBtn" disabled>ПРОКАЧАТЬ</button>
    <div id="upgradeMsg" style="color:#8d97ad;font-size:14px;min-height:20px"></div>
  </div>

  <div class="upgrade-bottom">
    <section class="panel">
      <div class="panel-head">
        <h2>Мои предметы</h2>
        <span id="invCount" style="color:#8d97ad;font-size:13px">0</span>
      </div>
      <div class="items-grid" id="myItems"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Выберите предмет</h2>
        <input type="search" id="targetSearch" placeholder="Поиск..." autocomplete="off">
      </div>
      <div class="items-grid" id="targetItems"></div>
    </section>
  </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/upgrade.js?v=svg-ring1"></script>
</body>
</html>
